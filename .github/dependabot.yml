# Dependency updates, weekly, as pull requests.
#
# This repository is the engine, so these entries are live and are the only copy. Until the split
# (2026-11-10) they sat at `substrate/` inside Scripta, where GitHub never read them and a Scripta
# check kept them in step with Scripta's own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(engine)"
    # The engine is a closed set that ships inside a signed bundle, so a version bump is a rebuild
    # and a re-notarization. Grouped to keep that to one review rather than a dozen.
    groups:
      engine:
        patterns:
          - "*"
