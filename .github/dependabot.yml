# Dependency updates, weekly, as pull requests.
#
# This repository is the engine, so these entries are live and are the only copy. Until the split
# (2026-11-10) they sat at `substrate/` inside Scripta, where GitHub never read them and a Scripta
# check kept them in step with Scripta's own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(engine)"
    # The engine is a closed set that ships inside a signed bundle, so a version bump is a rebuild
    # and a re-notarization. Grouped to keep that to a few reviews rather than a dozen, ONE PER TIER,
    # so a bump to docling or torch never holds up a fix to the core. Each tier lists, by name,
    # every package it adds to the lock, dependencies of dependencies included, which
    # `tests/test_dependency_tiers.py` holds to the lock. `other` takes the rest: the test and dev
    # groups.
    groups:
      core:
        patterns:
          - "numpy"
          - "pypdfium2"
          - "pyyaml"
      convert:
        patterns:
          - "annotated-doc"
          - "annotated-types"
          - "attrs"
          - "beautifulsoup4"
          - "certifi"
          - "charset-normalizer"
          - "click"
          - "colorama"
          - "defusedxml"
          - "doclang"
          - "docling-core"
          - "docling-slim"
          - "et-xmlfile"
          - "filetype"
          - "idna"
          - "jsonref"
          - "jsonschema"
          - "jsonschema-specifications"
          - "langcodes"
          - "latex2mathml"
          - "lxml"
          - "mail-parser"
          - "markdown-it-py"
          - "marko"
          - "mdurl"
          - "olefile"
          - "openpyxl"
          - "pandas"
          - "pillow"
          - "pluggy"
          - "pydantic"
          - "pydantic-core"
          - "pydantic-settings"
          - "pygments"
          - "pylatexenc"
          - "python-dateutil"
          - "python-docx"
          - "python-dotenv"
          - "python-oxmsg"
          - "python-pptx"
          - "referencing"
          - "requests"
          - "rich"
          - "rpds-py"
          - "shellingham"
          - "six"
          - "soupsieve"
          - "tabulate"
          - "tqdm"
          - "typer"
          - "typing-extensions"
          - "typing-inspection"
          - "tzdata"
          - "urllib3"
          - "xlsxwriter"
      convert-ml:
        patterns:
          - "accelerate"
          - "anyio"
          - "cuda-bindings"
          - "cuda-pathfinder"
          - "cuda-toolkit"
          - "docling-ibm-models"
          - "docling-parse"
          - "filelock"
          - "fsspec"
          - "h11"
          - "hf-xet"
          - "httpcore"
          - "httpx"
          - "huggingface-hub"
          - "jinja2"
          - "markupsafe"
          - "mpmath"
          - "networkx"
          - "nvidia-cublas"
          - "nvidia-cuda-cupti"
          - "nvidia-cuda-nvrtc"
          - "nvidia-cuda-runtime"
          - "nvidia-cudnn-cu13"
          - "nvidia-cufft"
          - "nvidia-cufile"
          - "nvidia-curand"
          - "nvidia-cusolver"
