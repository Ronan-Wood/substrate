# The Lean models of the verified paths, each against the real code: `blobs gc --unreferenced`
# (experiments/lean-blob-gc), compose's quarantine (experiments/lean-quarantine) and the conversion
# quarantine (experiments/lean-convert-quarantine).
#
# ON PULL REQUESTS THAT TOUCH THE ENGINE OR THE MODEL, and not a required check: a required check
# behind a path filter never reports on a pull request outside its paths, and a check that never
# reports blocks every merge. `substrate/**` whole, because the planner reads through more of the
# package than a hand-kept list would stay in step with. Like `docling.yml`, it does not run again on
# the merge to `main`; `workflow_dispatch` runs it by hand.
#
# ACTIONS ARE PINNED BY COMMIT, as in tests.yml. elan, which installs Lean, is pinned by release and
# checked against its SHA-256. The Lean toolchain elan then installs is pinned by version only (the
# one `lean/lean-toolchain` names), and arrives over TLS from Lean's own GitHub releases.
name: lean

on:
  pull_request:
    paths:
      - "experiments/lean-blob-gc/**"
      - "experiments/lean-quarantine/**"
      - "experiments/lean-convert-quarantine/**"
      - "substrate/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

# Read-only. Nothing here publishes, comments or writes to the repository.
permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: lean
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: elan v4.2.4, checked
        env:
          ELAN_URL: https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          curl -fsSL -o "$RUNNER_TEMP/elan.tar.gz" "$ELAN_URL"
          echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: build the model
        run: cd experiments/lean-blob-gc/lean && lake build
      - name: every theorem, and only Lean's standard axioms
        run: python3 experiments/lean-blob-gc/lean/check_axioms.py
      - name: build the quarantine model
        run: cd experiments/lean-quarantine/lean && lake build
      - name: every quarantine theorem, and only Lean's standard axioms
        run: python3 experiments/lean-quarantine/lean/check_axioms.py
      - name: build the conversion quarantine model
        run: cd experiments/lean-convert-quarantine/lean && lake build
      - name: every conversion quarantine theorem, and only Lean's standard axioms
        run: python3 experiments/lean-convert-quarantine/lean/check_axioms.py
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # The `test` group (hypothesis among it) and pyyaml, which the planner reads frontmatter with,
      # both exactly as the lock holds them, hashes checked.
      - run: uv venv --python 3.14
      - run: |
          uv export --frozen --only-group test --no-emit-project -o "$RUNNER_TEMP/test-group.txt"
          uv pip install --require-hashes -r "$RUNNER_TEMP/test-group.txt"
          uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/engine.txt"
          awk '/^pyyaml==/ { take = 1 } take { print } take && !/\\$/ { exit }' "$RUNNER_TEMP/engine.txt" > "$RUNNER_TEMP/pyyaml.txt"
          grep -q '^pyyaml==' "$RUNNER_TEMP/pyyaml.txt"
          uv pip install --require-hashes -r "$RUNNER_TEMP/pyyaml.txt"
      # Faithful spellings only: the model and the real planner must agree on every case.
      - name: the harness, 2,000 cases
        run: uv run --no-sync python experiments/lean-blob-gc/harness/run.py agree --cases 2000
      # A harness that cannot tell a broken planner from a working one passes everything. One planted
      # regression must be caught, with a disagreement and not a crash.
      - name: the harness still notices a planted regression
        run: |
          if out=$(uv run --no-sync python experiments/lean-blob-gc/harness/run.py agree --mutant six-days --cases 300 2>&1); then
            echo "$out"
            echo "the six-days regression went unnoticed: the harness is not testing the planner"
            exit 1
          fi
          echo "$out" | tail -n 5
          grep -q "minimal disagreement" <<<"$out"
      # Exits 1 while a spelling's reference is missed by the key scan, 2 if the repro is broken.
      - name: the repro passes
        run: uv run --no-sync python experiments/lean-blob-gc/harness/repro_hidden_reference.py
      # The real compose against the quarantine model, on generated vaults.
      - name: the quarantine harness, 2,000 cases
        run: uv run --no-sync python experiments/lean-quarantine/harness/run.py agree --cases 2000
      # Each planted regression must be caught, with a disagreement and not a crash.
      - name: the quarantine harness still notices every planted regression
        run: |
          for mutant in keep-stale ceiling-ge no-default faults-ignored allow-empty read-alike last-copy no-guard; do
            if out=$(uv run --no-sync python experiments/lean-quarantine/harness/run.py agree --mutant "$mutant" --cases 500 2>&1); then
              echo "$out"
              echo "the $mutant regression went unnoticed: the harness is not testing compose"
              exit 1
            fi
            echo "$out" | tail -n 5
            grep -q "minimal disagreement" <<<"$out"
          done
      # The real `quarantine_decision` against its model: generated cases, then every case up to
      # four outcomes, rejections included.
      - name: the conversion quarantine harness, 2,000 cases and every case to four outcomes
        run: |
          uv run --no-sync python experiments/lean-convert-quarantine/harness/run.py agree --cases 2000
          uv run --no-sync python experiments/lean-convert-quarantine/harness/run.py all --length 4
      # Each planted regression must be caught, with a disagreement and not a crash.
      - name: the conversion quarantine harness still notices every planted regression
        run: |
          for mutant in one-fault three-faults never-quarantine retry-an-answer refused-clears converted-keeps write-on-answer other-blocks retry-ignored bound-after-answer attempt-when-blocked; do
            if out=$(uv run --no-sync python experiments/lean-convert-quarantine/harness/run.py agree --mutant "$mutant" --cases 300 2>&1); then
              echo "$out"
              echo "the $mutant regression went unnoticed: the harness is not testing the rule"
              exit 1
            fi
            echo "$out" | tail -n 5
            grep -q "minimal disagreement" <<<"$out"
          done
