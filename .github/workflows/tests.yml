# The engine's tests, on a clean machine. The caches, the models and the built bundle are all on the
# developer's Mac, and a runner has none of them.
#
# This repository is the engine, so GitHub runs this file here. Until the split (2026-11-10) it sat
# at `substrate/` inside Scripta, where GitHub never read it.
#
# ACTIONS ARE PINNED BY COMMIT, not by tag. A tag is a moving pointer that its owner can repoint at
# any code, and these jobs run against this repository's contents. The version each hash belongs to
# is in the comment beside it.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only. Nothing here publishes, comments or writes to the repository.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    # THE NAME IS A CONTRACT once a rule requires this check: a required check that never reports
    # blocks every merge. So it does not carry the test count, and it runs on every change, never
    # behind a path filter.
    name: engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The uv that exports the lock and checks its hashes, pinned as in `engine docling`.
          version: "0.12.2"
      # THE CORE AND NOTHING ELSE: the three packages `pyproject.toml` declares, exactly as the lock
      # holds them, hashes checked. Neither extra, so a module that imports docling, torch or OpenCV
      # where the core can reach it fails here. `engine docling` runs the suite with both extras.
      - run: uv venv --python 3.14
      # The `test` group (pytest, and the frontmatter tests' hypothesis and ruamel.yaml) exactly as
      # the lock holds it, so this job and the one below run the same versions.
      - run: |
          uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/core.txt"
          uv export --frozen --only-group test --no-emit-project -o "$RUNNER_TEMP/test-group.txt"
          uv pip install --require-hashes -r "$RUNNER_TEMP/core.txt" -r "$RUNNER_TEMP/test-group.txt"
      # Fails the job if an extra's package is here, which would let its tests pass on what the core
      # does not have.
      - run: >-
          uv run --no-sync python -c "import importlib.util as u;
          found = [m for m in ('docling', 'torch', 'transformers', 'cv2', 'ocrmac', 'PIL')
          if u.find_spec(m)]; assert not found, f'not core: {found}'"
      - run: >-
          uv run --no-sync python -m pytest tests -q -rsx --junitxml "$RUNNER_TEMP/junit.xml"
      # EVERY SKIP IS NAMED. The list holds the tests that need an extra or another platform, each
      # with its reason; a skip it does not name, or a named test that ran, fails the job.
      - run: uv run --no-sync python tools/check-skips.py "$RUNNER_TEMP/junit.xml" tests/core-job-skips.txt
