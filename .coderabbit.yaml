# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit's automatic first-pass review of a pull request. It is ADVICE, never a gate: the
# maintainer's review decides (CONTRIBUTING.md, "Review"). Nothing here may make it block a merge,
# so `reviews.auto_approvals` (which requests changes) and `reviews.fail_commit_status` (which
# fails the `CodeRabbit` check) stay off, and that check is not a required status check. A line that
# restates a default is there for a property the maintainer relies on. Nothing in CI checks this
# file; it was validated by hand against the published schema.

# One maintainer who reads every comment: plain, short, no encouragement.
tone_instructions: "Terse. Name the defect and the fix. No praise, no restating the diff."

reviews:
  # `quiet`: only the most important feedback. `chill` is the default.
  profile: quiet

  # The summary goes in the walkthrough comment, not into the author's PR description.
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: "Three sentences at most."

  # No decoration and no extras the maintainer would scroll past.
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  changed_files_summary: false
  suggested_labels: false
  suggested_reviewers: false
  related_issues: false
  related_prs: false
  assess_linked_issues: false
  enable_prompt_for_ai_agents: false
  review_info: false
  # A skipped review (a draft, a Dependabot pull request) shows in the `CodeRabbit` check, not in a
  # comment on each one.
  review_status: false

  # Advice only. A review that errors ends neutral, so it can never hold a merge.
  auto_approvals:
    enabled: false
  fail_commit_status: false

  # Comments, not commits: nothing here pushes to a contributor's branch, which would be unsigned
  # and unreviewed.
  finishing_touches:
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  # Each of these adds a row to the walkthrough. CONTRIBUTING.md and the PR template already ask
  # for the same things.
  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"

  auto_review:
    enabled: true
    drafts: false
    # Pause automatic reviews after this many reviewed commits; CONTRIBUTING.md says so.
    auto_pause_after_reviewed_commits: 5
    # Dependabot's pull requests bump a version, grouped by tier in `.github/dependabot.yml`. CI
    # vets them, and a lockfile bump is noise to a reviewer. GitHub names the author exactly this.
    ignore_usernames:
      - "dependabot[bot]"

  # Files nobody reads. `!` excludes, and there is no include pattern, so everything else is
  # reviewed. Vulnerable dependencies are left to Dependabot: `uv.lock` is excluded here and
  # `osvScanner` is off below. CodeQL covers the Python source, not the lock.
  path_filters:
    # CodeRabbit already skips `*.lock`; this names it.
    - "!uv.lock"
    # Generated by `lake`. The hand-written `lakefile.toml`, `lean-toolchain` and `.lean` sources
    # stay reviewed.
    - "!experiments/**/lean/lake-manifest.json"
    # The licence texts and notices of the packages the bundle ships.
    - "!third_party_licenses/**"
    # Frozen inputs the tests read: an old contract export and a formats listing. Tests generate
    # every other fixture document when they run.
    - "!tests/data/**"

  # Each a rule CONTRIBUTING.md, CLAUDE.md, VERIFIED.md or a workflow's own header already states,
  # one entry per path. VERIFIED.md is the only list of verified files, so this file names none.
  # Rules a CI job already fails on (the skip lists, the Dependabot tiers, the contract export) are
  # left out: a comment on those would repeat a red check.
  path_instructions:
    - path: "substrate/**"
      instructions: "A bug fix ships a regression test that fails on the old code; flag a fix whose tests would pass without it. The engine refuses rather than misleads: flag a change that returns a plausible but wrong answer, or silently narrows an incomplete state, where it should fail. Look each changed file up in the first table of VERIFIED.md, which names every verified path's files, model and harness; flag a change to a listed file that its harness would not exercise."
    - path: "experiments/lean-*/**"
      instructions: "A Lean model, the code it models and its harness change together, because the harness fails on any difference between the model and the code (VERIFIED.md)."
    - path: "{tests/**,vaults/**,docs/**,eval/**}"
      instructions: "Fixtures, examples and docs hold only synthetic demo data: flag a real person's name, a real note title or a path under a home folder (CONTRIBUTING.md, rule 4)."
    - path: ".github/workflows/**"
      instructions: "The tier checks fail a job on purpose rather than let tests skip green (docling.yml: docling and torch import; tests.yml: no package outside the tier is present); flag a change that weakens one. Actions are pinned by commit hash with the version in a comment, never by tag. The required `engine` job never sits behind a path filter."

  # Tools. The other defaults stay on: actionlint, zizmor, shellcheck and gitleaks find defects here
  # and a tool with no matching file does not run. The ones turned off are style linters, or
  # scanners that overlap CI, Dependabot or CodeQL.
  tools:
    # `config_file` makes ruff use this repository's rule set (`[tool.ruff.lint]`, bug-catchers
    # only) rather than its profile's, less the codes CodeRabbit always drops (F401, F811, F841).
    # `main` has 18 findings that are deliberately left. CodeRabbit shows a tool's finding only in
    # an inline comment on the lines it covers, so one on a line a pull request doesn't touch is
    # not shown.
    ruff:
      enabled: true
      config_file: "pyproject.toml"
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    yamllint:
      enabled: false
    pylint:
      enabled: false
    flake8:
      enabled: false
    swiftlint:
      enabled: false
    semgrep:
      enabled: false
    opengrep:
      enabled: false
    trufflehog:
      enabled: false
    checkov:
      enabled: false
    trivy:
      enabled: false
    presidio:
      enabled: false
    osvScanner:
      enabled: false
    github-checks:
      enabled: false

# CodeRabbit replies when it is addressed, not to every reply under its comments.
chat:
  auto_reply: false
  art: false

# Data. CodeRabbit says it never trains on customer code, whatever is set here. The maintainer wants
# it to learn from this repository (learnings, issue and past-pull-request context), and the
# repository is public, so keeping them exposes nothing new: `opt_out` stays false, written down
# because it is a property relied on. Each scope is `local`, so a review of this repository reads
# only this repository's, and web search is left on, its default. CodeRabbit's docs name no role
# needed to create a learning with a comment on a pull request or issue, so a learning is advice,
# like everything else CodeRabbit says.
# `reviews.disable_cache` is not set: the review cache of the code and dependencies expires within
# seven days, and is encrypted except for open-source repositories.
knowledge_base:
  opt_out: false
  learnings:
    scope: local
  pull_requests:
    scope: local
  issues:
    scope: local
  # CLAUDE.md is a file CodeRabbit would otherwise read as review criteria. The rules a reviewer
  # needs from it are in `path_instructions`; the rest is the maintainer's working notes.
  code_guidelines:
    enabled: false

# Nothing from CodeRabbit on issues.
issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
