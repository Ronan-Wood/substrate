[project]
name = "substrate"
version = "0.2.2"
description = "Language-neutral knowledge substrate engine — structure-aware ingestion + retrieval"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
# THE CORE: Markdown, text and the PDF text layer, composition, the index and search. Everything a
# vault needs. Document conversion is in the two extras below, and nothing here may import them.
dependencies = [
    # The default PDF reader's text layer (`substrate/extract/pdftext_arm.py`).
    "pypdfium2>=5.15.0,<6",
    # `blobs gc` reads a note's frontmatter as YAML, so a reference spelled in any valid YAML keeps
    # its original; `substrate frontmatter check|fix` and compose's count read it that way too.
    "pyyaml>=6.0.3,<7",
    # The vector matrix (`substrate/store/vector_matrix.py`). It used to arrive only through docling.
    "numpy>=2.5.1,<3",
]

[project.optional-dependencies]
# docling's format readers, without torch: Office, HTML, CSV, WebVTT, AsciiDoc, LaTeX, email, EPUB.
# docling-slim's per-format extras rather than `docling`, whose `standard` set brings torch, the
# models and RapidOCR. Upper-bounded, because a pip install reads these ranges and not `uv.lock`.
convert = [
    "docling-slim[format-office,format-html,format-email,format-latex,format-web]>=2.148,<2.149",
    # The HTML coverage probe (`_html_text` in `substrate/extract/convert.py`) parses a page with
    # BeautifulSoup, as docling's HTML reader does. Imported directly, so declared here rather than
    # left to docling-slim's `format-html`.
    "beautifulsoup4>=4.15.0,<5",
]
# docling's PDF layout and table models, and image OCR. Everything `convert` has, plus torch.
convert-ml = [
    "substrate[convert]",
    "docling-slim[convert-core,models-local,format-pdf]>=2.148,<2.149",
    # Image OCR through Apple Vision. `substrate/extract/convert.py` names it explicitly, so a stray
    # install cannot switch OCR engines without a code change.
    "ocrmac>=1.0.0,<2; sys_platform == 'darwin'",
    # OpenCV, for docling's TableFormer, which reads the tables in every PDF and image and imports `cv2`
    # without declaring it. A `uv sync` of this repository builds it from source (below); a pip
    # install takes PyPI's wheel. The version bound is TableFormer's own.
    "opencv-python-headless>=5.0.0.93,<6",
]

[tool.uv]
package = false
# RAPIDOCR AND THE PREBUILT OPENCV ARE EXCLUDED, not merely unused. Every prebuilt macOS OpenCV wheel,
# headless included, bundles a GPL-3.0-or-later FFmpeg with x264 and x265, which v0.2.0 shipped without
# their source. No locked package asks for either today: docling's `standard` set, which the engine
# no longer installs, pulled in RapidOCR, and RapidOCR `opencv-python`. A marker that never matches
# keeps a later dependency from bringing either back into an environment uv builds.
override-dependencies = [
    "rapidocr; sys_platform == 'never'",
    "opencv-python; sys_platform == 'never'",
]
# OPENCV IS COMPILED HERE, WITH FFMPEG OFF, which is the only way to keep TableFormer without the GPL
# libraries. The default module set stays in, because OpenCV's packaging requires its Python typing
# stubs and a trimmed module list broke their generation (measured 2026-09-15).
#
# EVERY OPTIONAL HOST DEPENDENCY IS SWITCHED OFF BY NAME, so what ships does not depend on what happens
# to be installed on the building Mac: AVIF, JPEG XL, SPNG, TBB and Eigen would each be picked up from
# Homebrew if present and linked by absolute path. KleidiCV and G-API's ADE are downloads, Intel ITT is
# compiled-in tracing nothing here uses, and Java is probed for bindings that are never built.
# `tools/build-bundled-engine` refuses a bundle containing FFmpeg or linking outside the system and the
# bundle, so a regression fails loudly. The first build is long; uv caches the wheel.
no-binary-package = ["opencv-python-headless"]
# THE BUILD TOOLS ARE PINNED to the versions that produced the verified wheel. `uv.lock` pins runtime
# packages only, so without these a clean cache compiles native code with whatever is newest that day.
# CMake is not pinned here: OpenCV's backend uses the system CMake when it is recent enough.
build-constraint-dependencies = [
    "scikit-build==0.19.1",
    "setuptools==69.5.1",
    "numpy==2.3.2",
    "packaging==26.3",
    "pip==26.2.1",
    "ninja==1.13.2",
    # setuptools 69 asks for `wheel` to build any sdist (pylatexenc, under docling), and so does
    # scikit-build; unpinned, each clean build took whatever release was newest.
    "wheel==0.48.0",
]

[tool.uv.extra-build-dependencies]
opencv-python-headless = ["ninja"]

[tool.uv.extra-build-variables]
opencv-python-headless = { ENABLE_HEADLESS = "1", ENABLE_CONTRIB = "0", CMAKE_ARGS = "-DWITH_FFMPEG=OFF -DWITH_GSTREAMER=OFF -DVIDEOIO_ENABLE_PLUGINS=OFF -DWITH_KLEIDICV=OFF -DBUILD_opencv_gapi=OFF -DWITH_ADE=OFF -DWITH_AVIF=OFF -DWITH_JPEGXL=OFF -DWITH_SPNG=OFF -DWITH_TBB=OFF -DWITH_EIGEN=OFF -DWITH_ITT=OFF -DBUILD_JAVA=OFF -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOCS=OFF" }

[dependency-groups]
dev = ["ipykernel", "ruff>=0.17.5"]
# The `engine docling` CI job's runner, locked with hashes like the engine it tests.
# hypothesis drives the frontmatter property tests; ruamel.yaml is their YAML 1.2 reader.
test = ["pytest==9.2.0", "hypothesis==6.170.15", "ruamel.yaml==0.19.1"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Bug-catchers only. Pyflakes (F), the real-error slices of pycodestyle (E4 import
# placement, E7 incl. `== None`/bare-except, E9 syntax), bugbear (B), and pylint
# errors (PLE). Deliberately NO cosmetic families (import-sort, pyupgrade, simplify):
# this lints for problems, not style. Run: ./lint.sh  (or `uv run ruff check .`).
select = ["F", "E4", "E7", "E9", "B", "PLE"]
